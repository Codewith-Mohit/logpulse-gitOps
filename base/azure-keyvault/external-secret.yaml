apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: logipulse
spec:
  provider:
    azurekv:
      tenantId: REPLACE_WITH_AZURE_TENANT_ID
      vaultUrl: https://REPLACE_WITH_YOUR_KEYVAULT_NAME.vault.azure.net
      # Recommended approach: use Azure Workload Identity.
      # No client secret is stored in Git.
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: logipulse-secrets
  namespace: logipulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: logipulse-secrets
    creationPolicy: Owner
  data:
    - secretKey: sql-connection
      remoteRef:
        key: logipulse-sql-connection
    - secretKey: asb-connection
      remoteRef:
        key: logipulse-asb-connection
    - secretKey: jwt-secret
      remoteRef:
        key: logipulse-jwt-secret
